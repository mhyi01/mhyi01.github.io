<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영상통화 시험</title>
<!--
  폰 ↔ 태블릿 영상통화 품질 시험(웹 페이지 하나, 서버 없음).
  - 두 기기가 서로를 찾는 일만 무료 공개 서비스 PeerJS(0.peerjs.com)가 하고, 영상·소리는 두 기기 사이로 바로 오간다.
  - 직접 연결이 안 되는 통신망이면 PeerJS의 무료 중계(TURN)를 쓴다. 화면의 '연결 방식'에 표시된다.
  - 시험용 주소: ?host=localhost&port=9000 을 붙이면 그 PeerJS 서버를 쓴다(개발용).
-->
<style>
:root{--bg:#0f1215;--panel:rgba(15,18,21,.72);--fg:#f3f1ee;--muted:#b9c1c8;--amber:#f0b45a;--red:#e5484d;--green:#3fb37f}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#remote{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#local{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top));width:28vw;max-width:220px;aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.25);background:#222;z-index:2;transform:scaleX(-1)}
#local.back{transform:none}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:16px 12px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75));z-index:3;flex-wrap:wrap}
button{font:inherit;font-size:17px;border:0;border-radius:999px;padding:14px 18px;background:#2a3036;color:var(--fg);cursor:pointer;min-height:52px}
button.on{background:var(--amber);color:#1a1300}button.end{background:var(--red)}
button.big{font-size:22px;padding:20px 40px;background:var(--amber);color:#1a1300;min-width:240px}
#stats{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top));background:var(--panel);padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.6;z-index:2;max-width:calc(100vw - 48px - 28vw);white-space:pre-line;font-variant-numeric:tabular-nums}
#status{position:fixed;left:0;right:0;top:42%;text-align:center;font-size:21px;padding:0 24px;z-index:1;color:var(--muted);line-height:1.5}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;z-index:5;background:var(--bg);text-align:center}
#start h1{font-size:28px;margin:0}#start p{color:var(--muted);margin:0;font-size:17px;line-height:1.6;max-width:520px}
#share{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:520px}
#link{word-break:break-all;background:#1c2228;padding:12px 14px;border-radius:12px;font-size:15px;width:100%;user-select:all}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
</style></head><body>
<video id="remote" autoplay playsinline></video>
<video id="local" autoplay playsinline muted></video>
<div id="status"></div>
<button id="unmute" class="big" hidden style="position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:5">▶ 상대 화면·소리 켜기</button>
<div id="stats" hidden></div>
<div id="bar" hidden>
  <button id="mic" class="on">🎤 마이크</button>
  <button id="cam" class="on">📷 카메라</button>
  <button id="flip">🔄 앞/뒤</button>
  <button id="hd">화질 720p</button>
  <button id="st" class="on">📊 품질</button>
  <button id="hang" class="end">끊기</button>
</div>
<div id="start">
  <h1>영상통화 시험</h1>
  <p id="intro"></p>
  <div id="share" hidden>
    <div id="link"></div>
    <button id="sharebtn">🔗 링크 보내기</button>
  </div>
  <button id="go" class="big" hidden>통화 시작</button>
  <button id="newroom" class="big" hidden>새 통화 만들기</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
// 신호 주고받기: 공개 MQTT 서버 2곳(계정 없음, 메시지 수 제한 없음)에 동시에 붙어 통화 제안·응답만 주고받고, 영상은 두 기기가 직접(또는 중계 서버로) 주고받는다
const $ = s => document.querySelector(s);
const P = new URLSearchParams(location.search);
const code = P.get('c');
const host = P.get('r') === 'a';                         // 통화를 만든 쪽(a)이 기다리고, 링크로 들어온 쪽(b)이 건다
const BROKERS = P.get('mqtt') ? [P.get('mqtt')] : ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const TOPIC = 'gyeote/call/' + code;
const ME = (host ? 'a-' : 'b-') + Math.random().toString(36).slice(2, 10);
// 중계 서버 후보. 자동 시험(e2e)으로 실제로 중계가 되는 것만 기본값에 남긴다
const TURNS = {
  openrelay: {urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject'},
  freestun: {urls: ['turn:freestun.net:3478', 'turns:freestun.net:5350'], username: 'free', credential: 'free'},
  peerjs: {urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp'}};
const TURN_USE = (P.get('turn') || 'openrelay,freestun,peerjs').split(',').filter(k => TURNS[k]);
const ICE = [{urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478']}].concat(TURN_USE.map(k => TURNS[k]));
const RELAY_ONLY = P.get('relay') === '1';            // 시험용: 중계 서버로만 연결
let es, local, pc, peerId = null, offerId = null, facing = 'user', hd = false, timer, last = {}, helloT, lastHello = 0;
const D = {서버: '-', 상대: '-', 연결: '-'};
const say = t => { $('#status').dataset.msg = t || ''; $('#status').textContent = (t ? t + '\n' : '') + `[서버 ${D.서버} · 상대 ${D.상대} · 연결 ${D.연결}]`; };
const diag = (k, v) => { D[k] = v; say($('#status').dataset.msg); };
const guestLink = c => location.origin + location.pathname + '?c=' + c + ['mqtt', 'turn', 'relay'].filter(k => P.get(k)).map(k => '&' + k + '=' + encodeURIComponent(P.get(k))).join('');

const UA = navigator.userAgent;
const inApp = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(UA);
if (/KAKAOTALK/i.test(UA)) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
if (inApp) alert('지금 앱 안의 브라우저로 열려 있어 영상통화가 안 될 수 있습니다.\n오른쪽 위 메뉴에서 [다른 브라우저로 열기] 또는 [Chrome으로 열기]를 눌러 주세요.');
if (!code) {
  $('#intro').textContent = '한쪽 기기(예: 폰)에서 [새 통화 만들기]를 누르고, 나오는 링크를 다른 기기(예: 태블릿)로 보내 여세요.';
  $('#newroom').hidden = false;
} else if (host) {
  $('#intro').textContent = '아래 링크를 다른 기기로 보내 여세요. 그리고 [통화 시작]을 누르세요.';
  $('#share').hidden = false; $('#link').textContent = guestLink(code); $('#go').hidden = false;
} else {
  $('#intro').textContent = '[통화 시작]을 누르면 상대와 연결됩니다.';
  $('#go').hidden = false;
}
$('#newroom').onclick = () => {
  const c = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
  const q = new URLSearchParams(P); q.set('c', c); q.set('r', 'a'); location.search = q.toString();
};
$('#sharebtn').onclick = async () => {
  const url = $('#link').textContent;
  try { if (navigator.share) { await navigator.share({title: '영상통화', url}); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(url); $('#sharebtn').textContent = '✅ 복사했습니다'; } catch (e) { prompt('이 링크를 복사하세요', url); }
};

async function getMedia() {
  const v = hd ? {width: {ideal: 1920}, height: {ideal: 1080}} : {width: {ideal: 1280}, height: {ideal: 720}};
  return navigator.mediaDevices.getUserMedia({
    audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true},
    video: {...v, frameRate: {ideal: 30}, facingMode: facing}});
}

$('#go').onclick = async () => {
  try { local = await getMedia(); }
  catch (e) { alert('카메라·마이크를 켤 수 없습니다: ' + e.message + '\n브라우저의 카메라·마이크 권한을 허용해 주세요.'); return; }
  $('#local').srcObject = local;
  $('#start').hidden = true; $('#bar').hidden = false; $('#stats').hidden = false;
  start();
};

// --- 신호 주고받기: 붙어 있는 모든 서버에 보내고, 어느 서버로 오든 한 번만 처리한 ---
let clients = [];
const seen = new Set();
function send(msg) {
  const body = JSON.stringify(Object.assign({from: ME, mid: Math.random().toString(36).slice(2, 10)}, msg));
  clients.forEach(c => { if (c.connected) c.publish(TOPIC, body); });
}
function onRaw(text) {
  let m; try { m = JSON.parse(text); } catch (e) { return; }
  if (!m.from || m.from === ME || (m.to && m.to !== ME)) return;
  if (m.mid) { if (seen.has(m.mid)) return; seen.add(m.mid); }
  onMsg(m).catch(e => console.error(e));
}
function srvState() {
  const n = clients.filter(c => c.connected).length;
  diag('서버', n ? `연결됨(${n})` : '다시 잇는 중');
}
function listen() {
  if (!window.mqtt) { diag('서버', '실패'); say('연결 도구를 불러오지 못했습니다. 인터넷을 확인하고 새로고침하세요.'); return; }
  clients = BROKERS.map(u => {
    const c = mqtt.connect(u, {clientId: ME + '-' + Math.random().toString(36).slice(2, 6), clean: true, connectTimeout: 8000, reconnectPeriod: 3000, keepalive: 30});
    c.on('connect', () => { c.subscribe(TOPIC); srvState(); hello(true); });
    c.on('message', (t, buf) => onRaw(buf.toString()));
    c.on('close', srvState); c.on('offline', srvState); c.on('error', srvState);
    return c;
  });
  setTimeout(() => { if (!clients.some(c => c.connected)) diag('서버', '실패'); }, 10000);
}
function hello(force) {
  if (!force && Date.now() - lastHello < 4000) return;
  lastHello = Date.now(); send({t: 'hello', role: host ? 'a' : 'b'});
}
function connected() { return pc && ['connected', 'completed'].includes(pc.iceConnectionState); }

function start() {
  say('연결 준비 중…');
  listen();
  // 연결될 때까지 6초마다 "여기 있어요" 신호를 보낸다
  clearInterval(helloT); helloT = setInterval(() => { if (!connected()) hello(); }, 6000);
  addEventListener('pagehide', () => { try { send({t: 'bye'}); } catch (e) {} });
  say(host ? '상대를 기다리는 중…\n다른 기기에서 링크를 열고 [통화 시작]을 누르세요.' : '상대를 찾는 중…\n만든 쪽 기기에서 [통화 시작]을 눌렀는지 확인하세요.');
}

// 브라우저가 소리 있는 자동 재생을 막으면 [화면·소리 켜기] 단추를 보여 준다
function playRemote() {
  const v = $('#remote'); v.muted = false;
  v.play().then(() => { $('#unmute').hidden = true; }).catch(() => { $('#unmute').hidden = false; });
}
function newPc() {
  pc && pc.close();
  const p = new RTCPeerConnection({iceServers: ICE, iceTransportPolicy: RELAY_ONLY ? 'relay' : 'all'});
  local.getTracks().forEach(t => p.addTrack(t, local));
  p.ontrack = e => {
    const v = $('#remote');
    let st = e.streams && e.streams[0];
    if (!st) { st = v.srcObject instanceof MediaStream ? v.srcObject : new MediaStream(); st.addTrack(e.track); }
    if (v.srcObject !== st) v.srcObject = st;
    playRemote();
  };
  p.oniceconnectionstatechange = () => {
    if (p !== pc) return;
    diag('연결', p.iceConnectionState);
    if (connected()) playRemote();
    if (connected()) say('');
    if (p.iceConnectionState === 'failed') { say('연결 실패: 두 통신망 사이를 잇지 못했습니다. 다시 시도합니다…'); offerId = null; hello(true); }
  };
  pc = p; diag('연결', p.iceConnectionState);
  clearInterval(timer); last = {}; timer = setInterval(stats, 1000);
  return p;
}
// 후보 주소를 다 모을 때까지(최대 4초) 기다렸다가 한 번에 보낸다
function gathered(p) {
  return new Promise(res => {
    if (p.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, 4000);
    p.addEventListener('icegatheringstatechange', () => { if (p.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
  });
}

async function onMsg(m) {
  if (m.t === 'hello') {
    if (m.role === (host ? 'a' : 'b')) return;              // 같은 편 신호는 무시
    diag('상대', '찾음');
    if (host) { if (!connected()) hello(); return; }       // 만든 쪽: 대답만 한다(링크 쪽이 건다)
    if (connected() && peerId === m.from) return;
    const busy = pc && ['new', 'checking'].includes(pc.iceConnectionState);
    if (offerId && peerId === m.from && busy && Date.now() - offerId.t < 25000) return;   // 방금 건 연결이 아직 진행 중
    peerId = m.from; offerId = {id: Math.random().toString(36).slice(2, 8), t: Date.now()};
    say('연결하는 중…');
    const p = newPc();
    await p.setLocalDescription(await p.createOffer());
    await gathered(p); setBitrate();
    send({t: 'offer', to: m.from, oid: offerId.id, sdp: p.localDescription.sdp});
  } else if (m.t === 'offer' && host) {
    peerId = m.from; diag('상대', '찾음'); say('연결하는 중…');
    const p = newPc();
    await p.setRemoteDescription({type: 'offer', sdp: m.sdp});
    await p.setLocalDescription(await p.createAnswer());
    await gathered(p); setBitrate();
    send({t: 'answer', to: m.from, oid: m.oid, sdp: p.localDescription.sdp});
  } else if (m.t === 'answer' && !host) {
    if (!offerId || m.oid !== offerId.id || !pc || pc.signalingState !== 'have-local-offer') return;
    await pc.setRemoteDescription({type: 'answer', sdp: m.sdp});
  } else if (m.t === 'bye' && m.from === peerId) {
    pc && pc.close(); pc = null; peerId = null; offerId = null;
    $('#remote').srcObject = null; diag('상대', '나감'); diag('연결', '-');
    say('상대가 나갔습니다. 다시 들어오면 자동으로 연결됩니다.');
    hello(true);
  }
}

function setBitrate() {
  if (!pc) return;
  pc.getSenders().filter(s => s.track && s.track.kind === 'video').forEach(s => {
    const p = s.getParameters(); if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = hd ? 4_000_000 : 2_000_000; s.setParameters(p).catch(() => {});
  });
}

async function stats() {
  if (!pc) return;
  const r = await pc.getStats();
  let inV, inA, outV, pair, codec = {};
  r.forEach(s => {
    if (s.type === 'inbound-rtp' && s.kind === 'video') inV = s;
    if (s.type === 'inbound-rtp' && s.kind === 'audio') inA = s;
    if (s.type === 'outbound-rtp' && s.kind === 'video') outV = s;
    if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') pair = s;
    if (s.type === 'codec') codec[s.id] = s.mimeType;
  });
  const lines = [];
  const kbps = (s, key) => { const p = last[key]; last[key] = {t: s.timestamp, b: s.bytesReceived ?? s.bytesSent};
    return p ? Math.round((last[key].b - p.b) * 8 / (s.timestamp - p.t)) : 0; };
  let rtt = null;
  if (inV) {
    const lost = inV.packetsLost || 0, recv = inV.packetsReceived || 0;
    lines.push(`받는 화면  ${inV.frameWidth || '-'}×${inV.frameHeight || '-'} · ${Math.round(inV.framesPerSecond || 0)}fps`);
    lines.push(`받는 속도  ${(kbps(inV, 'inV') / 1000).toFixed(2)} Mbps`);
    lines.push(`영상 손실  ${(lost / Math.max(1, lost + recv) * 100).toFixed(1)}% · 멈춤 ${inV.freezeCount ?? '-'}번`);
    lines.push(`영상 코덱  ${(codec[inV.codecId] || '-').replace('video/', '')}`);
  }
  if (inA) { const l = inA.packetsLost || 0, rc = inA.packetsReceived || 0; lines.push(`소리 손실  ${(l / Math.max(1, l + rc) * 100).toFixed(1)}%`); }
  if (outV) lines.push(`보내는 화면  ${outV.frameWidth || '-'}×${outV.frameHeight || '-'} · ${Math.round(outV.framesPerSecond || 0)}fps · ${(kbps(outV, 'outV') / 1000).toFixed(2)} Mbps`);
  if (pair) {
    rtt = pair.currentRoundTripTime;
    const lc = r.get(pair.localCandidateId), rc = r.get(pair.remoteCandidateId);
    const relay = (lc && lc.candidateType === 'relay') || (rc && rc.candidateType === 'relay');
    lines.push(`왕복 지연  ${rtt != null ? Math.round(rtt * 1000) + 'ms' : '-'}`);
    lines.push(`연결 방식  ${relay ? '중계(TURN)' : '직접(P2P)'}${lc && lc.networkType ? ' · ' + lc.networkType : ''}`);
  }
  const good = inV && (inV.framesPerSecond || 0) >= 20 && (rtt == null || rtt < 0.3);
  $('#stats').innerHTML = `<span class="dot" style="background:${!inV ? '#888' : good ? 'var(--green)' : 'var(--amber)'}"></span>` + lines.join('\n');
}


// --- 원격 진단: 연결 상태 요약(주소는 빼고 종류만)을 진단 채널로 보낸다 ---
const DIAG = 'gyeote/diag/q7m3/';
const ERR = [];
addEventListener('error', e => ERR.push(String(e.message).slice(0, 120)));
async function report() {
  const v = $('#remote'), o = {role: host ? 'a' : 'b', me: ME.slice(0, 6), c: (code || '').slice(0, 4), ua: UA.replace(/\(.*?\)/, '').slice(0, 90), D: Object.assign({}, D),
    msg: ($('#status').dataset.msg || '').slice(0, 60), video: {paused: v.paused, rs: v.readyState, w: v.videoWidth, h: v.videoHeight, tracks: v.srcObject ? v.srcObject.getTracks().map(t => t.kind + ':' + t.readyState + (t.muted ? ':muted' : '')).join(',') : 'none'},
    local: local ? local.getTracks().map(t => t.kind + ':' + t.readyState + ':' + (t.enabled ? 'on' : 'off')).join(',') : 'none', err: ERR.slice(-3)};
  if (pc) {
    o.pc = {sig: pc.signalingState, ice: pc.iceConnectionState, conn: pc.connectionState, gather: pc.iceGatheringState,
      tx: pc.getTransceivers().map(t => (t.receiver.track && t.receiver.track.kind) + ':' + t.direction + '/' + t.currentDirection).join(',')};
    try {
      const r = await pc.getStats(); const lc = {}, rc = {}; let pair = null; const rtp = [];
      r.forEach(x => {
        if (x.type === 'local-candidate') lc[x.candidateType + '/' + x.protocol] = (lc[x.candidateType + '/' + x.protocol] || 0) + 1;
        if (x.type === 'remote-candidate') rc[x.candidateType + '/' + x.protocol] = (rc[x.candidateType + '/' + x.protocol] || 0) + 1;
        if (x.type === 'candidate-pair' && x.nominated) pair = {state: x.state, l: (r.get(x.localCandidateId) || {}).candidateType, r: (r.get(x.remoteCandidateId) || {}).candidateType, rtt: x.currentRoundTripTime, sent: x.bytesSent, recv: x.bytesReceived};
        if (x.type === 'inbound-rtp' || x.type === 'outbound-rtp') rtp.push(x.type.slice(0, 2) + '-' + x.kind + ':' + (x.bytesReceived ?? x.bytesSent) + 'B' + (x.framesDecoded != null ? ' dec' + x.framesDecoded : '') + (x.framesEncoded != null ? ' enc' + x.framesEncoded : ''));
      });
      Object.assign(o, {lc, rc, pair, rtp});
    } catch (e) { o.statsErr = e.message; }
  }
  o.t = Date.now();
  clients.forEach(c => { if (c.connected) c.publish(DIAG + o.role, JSON.stringify(o), {retain: true}); });
}
setInterval(() => { if (local) report(); }, 8000);

$('#unmute').onclick = () => playRemote();
$('#mic').onclick = e => { const t = local.getAudioTracks()[0]; t.enabled = !t.enabled; e.target.classList.toggle('on', t.enabled); };
$('#cam').onclick = e => { const t = local.getVideoTracks()[0]; t.enabled = !t.enabled; e.target.classList.toggle('on', t.enabled); };
$('#st').onclick = e => { const s = $('#stats'); s.hidden = !s.hidden; e.target.classList.toggle('on', !s.hidden); };
async function swapVideo() {
  local.getVideoTracks().forEach(t => t.stop());                 // 폰은 카메라를 하나만 열 수 있어 먼저 끈다
  const nv = await getMedia(); const vt = nv.getVideoTracks()[0];
  nv.getAudioTracks().forEach(t => t.stop());
  local.getVideoTracks().forEach(t => local.removeTrack(t)); local.addTrack(vt);
  $('#local').srcObject = local; $('#local').classList.toggle('back', facing !== 'user');
  if (pc) { const s = pc.getSenders().find(s => s.track && s.track.kind === 'video') || pc.getSenders().find(s => !s.track); if (s) await s.replaceTrack(vt); setBitrate(); }
}
$('#flip').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; try { await swapVideo(); } catch (e) { alert(e.message); } };
$('#hd').onclick = async e => { hd = !hd; e.target.textContent = hd ? '화질 1080p' : '화질 720p'; e.target.classList.toggle('on', hd); try { await swapVideo(); } catch (err) { alert(err.message); } };
$('#hang').onclick = async () => { clearInterval(helloT); send({t: 'bye'}); await new Promise(r => setTimeout(r, 300)); clients.forEach(c => c.end(true)); pc && pc.close(); local && local.getTracks().forEach(t => t.stop()); location.reload(); };
