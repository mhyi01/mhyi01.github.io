name: webcall-e2e
on:
  push:
    paths: ['webcall/**', 'test/**', '.github/workflows/webcall-e2e.yml']
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8080 --bind 127.0.0.1 &) && sleep 1 && node test/e2e.cjs
